  {q:'Надеть кроссовки и выйти.',options:['Кие беру','Киіп шығу','Киіп көру'],c:1,why:'Киіп шығу — надеть и выйти.'},
  {q:'Продолжать ходить в старом свитере.',options:['Киіп көру','Киіп тоздыру','Кие беру'],c:2,why:'Кие беру — продолжать носить.'},
  {q:'Носить джинсы до дыр.',options:['Киіп тоздыру','Киіп шығу','Киіп жүру'],c:0,why:'Киіп тоздыру — износить.'},
  {q:'«Мына аяқ киімді киіп көруге бола ма?» — это...',options:['Можно надеть обувь и выйти?','Можно примерить эту обувь?','Можно выбросить обувь?'],c:1,why:'Вопрос о разрешении на примерку.'},
  {q:'Что важнее для «кие салу»?',options:['Долго примерять','Выйти из дома','Надеть без лишних раздумий'],c:2,why:'Салу придаёт оттенок простого, быстрого действия.'},
  {q:'Выберите грамматически корректную форму.',options:['Мен үйде халат кийіп жүремін.','Мен үйде халат киіп жүремін.','Мен үйде халат киеп жүремін.'],c:1,why:'Пишем «киіп».'},
  {q:'Какой ряд отражает последовательность из видео?',options:['Примерить → носить → износить','Износить → примерить → носить','Выйти → разуться → примерить'],c:0,why:'Образ жизненного цикла одежды помогает закрепить выражения.'}
 ]
};
const ORDER=[
 {tokens:['Мен','үйде','халат','киіп','жүремін.'],tr:'Я дома хожу в халате.'},
 {tokens:['Мына','аяқ','киімді','киіп','көруге','бола','ма?'],tr:'Можно примерить эту обувь?'},
 {tokens:['Мен','қара','көйлек','кие','салдым.'],tr:'Я просто надела чёрное платье.'},
 {tokens:['Ол','үйден','худи','киіп','шықты.'],tr:'Она надела худи и вышла из дома.'},
 {tokens:['Ол','бір','футболканы','кие','береді.'],tr:'Он продолжает носить одну футболку.'}
];
const COUNT={1:3,2:6,3:6,4:8,5:5,6:6,7:4,8:10};
const LS='qazline-kiyu-lesson-v1';
let state={step:0,answers:{},order:{},checked:{},started:false};
try{const saved=JSON.parse(localStorage.getItem(LS)||'null');if(saved&&typeof saved==='object')state={...state,...saved};}catch(e){}
const el=id=>document.getElementById(id);
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[x]));
const track=(event,extra={})=>{if(Array.isArray(window.dataLayer))window.dataLayer.push({event,lesson_id:'qazline-kiyu',...extra});};
function saved(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}}
const PIC_SLUGS=['zhuru','koru','salu','shygu','beru','tozdyru'];
const pic=(i,label,quiz=false)=>`<div class="kiyu-picture-wrap"><img class="kiyu-img" src="assets/highres/${quiz?'quiz':'labeled'}-${PIC_SLUGS[i]}.webp" width="1672" height="941" loading="lazy" decoding="async" alt="${escapeHtml(label||'Иллюстрация к заданию')}"></div>`;
function points(step){if(step===5)return ORDER.reduce((n,x,i)=>n+(JSON.stringify(state.order?.[i]||[])===JSON.stringify(x.tokens.map((_,j)=>j))?1:0),0);
return (MC[step]||[]).reduce((n,q,i)=>n+(Number(state.answers?.[step]?.[i])===q.c?1:0),0);}
function complete(step){return Boolean(state.checked?.[step])&&points(step)===COUNT[step];}
function nav(){el('steps').innerHTML=NAMES.map((name,i)=>`<button type="button" class="step ${state.step===i?'current':''} ${complete(i)?'done':''}" data-go="${i}"><span class="num">${i===0?'★':complete(i)?'✓':i}</span><span>${escapeHtml(name)}</span></button>`).join('');
 const total=Object.values(COUNT).length,n=Object.keys(COUNT).filter(n=>complete(Number(n))).length;
 el('bar').style.width=Math.round(n/total*100)+'%';el('pct').textContent=Math.round(n/total*100)+'%';
 el('mobileStepSelect').innerHTML=NAMES.map((v,i)=>`<option value="${i}" ${state.step===i?'selected':''}>${escapeHtml(v)}</option>`).join('');
}
function go(n){const v=Number(n);if(!Number.isInteger(v)||v<0||v>=NAMES.length)return;if(!state.started&&v>0){state.started=true;track('lesson_start');}
 state.step=v;saved();render();window.scrollTo({top:0,behavior:'instant'});}
function header(i,k,title,description){return `<div class="section-head"><span class="pill">ШАГ ${i} / 8</span><span class="eyebrow">${escapeHtml(k)}</span></div><h1 class="h2">${title}</h1><p class="lead">${description}</p>`;}
function footer(i){return `<div class="kiyu-next"><button class="btn outline" type="button" data-go="${i-1}">← Назад</button><button class="btn primary" type="button" data-go="${Math.min(i+1,8)}">${i===7?'К финальному тесту':i===8?'К результатам':'Следующий шаг'} →</button></div>`;}
function questions(step){
 const data=MC[step]||[];
 return `<div>${data.map((q,i)=>{
  const chosen=state.answers?.[step]?.[i];const checked=state.checked?.[step];const right=q.c===Number(chosen)&&chosen!==undefined;
  return `<div class="kiyu-q"><span class="kiyu-q-num">ЗАДАНИЕ ${i+1} ИЗ ${data.length}</span>${q.image!==undefined?`<div class="kiyu-quiz-image">${pic(q.image,'Иллюстрация к вопросу '+(i+1),true)}</div>`:''}<h3 class="kiyu-q-title">${escapeHtml(q.q)}</h3><div class="kiyu-choices">${q.options.map((v,j)=>`<button type="button" class="kiyu-choice ${Number(chosen)===j?'sel':''} ${checked&&j===q.c?'good':''} ${checked&&Number(chosen)===j&&j!==q.c?'bad':''}" data-q="${i}" data-a="${j}" aria-pressed="${Number(chosen)===j}"><span class="kiyu-bullet">${String.fromCharCode(65+j)}</span>${escapeHtml(v)}</button>`).join('')}</div>${checked?`<div class="kiyu-explain ${right?'good':'bad'}">${right?'✓ Верно!':'Правильный ответ: '+escapeHtml(q.options[q.c])+'.'} ${escapeHtml(q.why)}</div>`:''}</div>`;
 }).join('')}</div>${check(step)}`;
}
function check(step){
 let correct=points(step),total=COUNT[step],isChecked=Boolean(state.checked?.[step]);
 return `<div class="kiyu-check-box"><div class="kiyu-check-row"><div class="kiyu-check-score">${isChecked?(correct===total?'Керемет! Всё правильно!':'Правильно: '+correct+' из '+total):'Готов(а) проверить? · '+total+' заданий'}</div><button type="button" class="btn primary" data-check="${step}">Проверить ответы →</button></div>${isChecked?`<div class="kiyu-check-bar"><span style="width:${Math.round(correct/total*100)}%"></span></div>`:''}</div>`;
}
function intro(){
 return `<div class="hero kiyu-hero"><div class="hero-copy kiyu-lead"><span class="pill">QAZLINE · КАЗАХСКИЙ ЯЗЫК</span><h1 class="hero-h">Надеть,<br><em>примерить,</em><br>износить</h1><p class="hero-p">Один глагол — <b>кию</b>. Шесть разных оттенков: от примерочной до старых джинсов. Разбираемся на примерах из видео Динары.</p><div class="hero-meta"><span>6 выражений</span><span>48 заданий</span><span>Иллюстрации Qazline</span></div></div><div class="kiyu-hero-pic">${pic(1,'Девушка примеряет сапоги')}</div></div>
 <div class="page kiyu-intro-body"><h2 class="h2">Сначала видео, затем практика</h2><p class="lead">Посмотри объяснение, потом попробуй распознать значение в разных ситуациях.</p>
 <div class="kiyu-video"><div class="kiyu-video-head"><strong>Динара · Глагол «кию»</strong><span>СМОТРИ ПЕРЕД ПРАКТИКОЙ</span></div><div class="kiyu-embed"><iframe src="https://www.youtube-nocookie.com/embed/dFHTLTJHQ_A?rel=0&amp;playsinline=1" title="Кию: сложные глаголы с Динарой — Qazline" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><div class="kiyu-video-footer">Посмотри видео и нажми «Начать практику», чтобы перейти к заданиям.</div></div><div class="kiyu-start-wrap"><button type="button" class="btn primary" data-go="1">Начать практику →</button></div>
 <div class="kiyu-note"><strong>Как проходить:</strong> сначала посмотри объяснение Динары, затем изучи примеры. В обучающих карточках названия есть на иллюстрациях, но в тесте по картинкам мы их специально убрали — подсказок не будет.</div>
 <h3 class="kiyu-subheading">Что ты узнаешь</h3><div class="kiyu-wordbank">${LESSONS.map((v)=>`<span>${v.name}</span>`).join('')}</div></div>`;
}
function page1(){return `<div class="page">${header(1,'ОСНОВА УРОКА','Кию — одно слово, много смыслов','На казахском «надеть», «примерить», «надеть и выйти» могут выражаться комбинациями глаголов.')}<div class="kiyu-pair"><div class="kiyu-compare"><h3>Кию</h3><p>Надеть / носить конкретную вещь.<br><b>Мен киім киемін.</b> — Я ношу одежду.</p></div><div class="kiyu-compare orange"><h3>Киіну</h3><p>Одеваться в целом.<br><b>Мен киінемін.</b> — Я одеваюсь.</p></div></div><div class="kiyu-note"><strong>Как строится:</strong> от глагола <b>кию</b> образуются две соединительные формы. <b>Киіп</b> используем в сочетаниях <b>киіп жүру</b>, <b>киіп көру</b>, <b>киіп шығу</b>, <b>киіп тоздыру</b>. <b>Кие</b> — в сочетаниях <b>кие салу</b> и <b>кие беру</b>. Запомни написание: <b>киіп</b> и <b>кие</b> (без «й»).</div><h3 class="kiyu-subheading">Проверь, что уже понятно</h3>${questions(1)}${footer(1)}</div>`;}
function page2(){return `<div class="page">${header(2,'6 ВЫРАЖЕНИЙ','Запомни шесть оттенков','Все иллюстрации взяты из видео Qazline. Рассмотри картинку, прочти пример, затем ответь на вопросы.')}<div class="kiyu-grid">${LESSONS.map((x,i)=>`<div class="kiyu-card">${pic(i,x.name)}<div class="kiyu-card-body"><h3 class="kiyu-card-h">${x.name}</h3><div class="kiyu-card-ru">${x.ru}</div><p class="kiyu-helper">${x.desc}</p><div class="kiyu-card-sample">${x.example}</div><div class="kiyu-card-trans">${x.trans}</div></div></div>`).join('')}</div><div class="kiyu-note"><strong>Обрати внимание:</strong> «кие беру» не обязательно означает «годами одну вещь». Главный смысл — продолжение. «Киіп тастау» Динара употребляет разговорно в контексте износа; для однозначных заданий используем «киіп тоздыру».</div><h2 class="kiyu-subheading">Узнаёшь перевод?</h2>${questions(2)}${footer(2)}</div>`;}
function page3(){return `<div class="page">${header(3,'ВИЗУАЛЬНАЯ ПРАКТИКА','Картинка подскажет','Узнай выражение по ситуации на иллюстрации. Не просто перевод — именно тот оттенок смысла, который нужен.')} ${questions(3)}${footer(3)}</div>`;}
function page4(){return `<div class="page">${header(4,'ТОНКИЕ РАЗЛИЧИЯ','Похожие — не одинаковые','Сравним выражения, которые легко перепутать даже после просмотра видео.')}<div class="kiyu-pair"><div class="kiyu-compare"><h3>Кие салу</h3><p>Быстро накинуть, <b>не раздумывая</b>. Выходить необязательно.</p></div><div class="kiyu-compare orange"><h3>Киіп шығу</h3><p>Надеть вещь и <b>выйти</b> из дома/помещения.</p></div><div class="kiyu-compare"><h3>Киіп жүру</h3><p><b>Привычка</b> или постоянное ношение определённой одежды.</p></div><div class="kiyu-compare orange"><h3>Кие беру</h3><p><b>Продолжать</b> носить вещь, иногда снова и снова.</p></div></div>${questions(4)}${footer(4)}</div>`;}
function page5(){
 const blocks=ORDER.map((item,i)=>{
  const order=state.order?.[i]||[],done=state.checked?.[5],correct=JSON.stringify(order)===JSON.stringify(item.tokens.map((_,j)=>j));
  const shuffled=[...item.tokens.keys()].sort((a,b)=>((a*7+3)%11)-((b*7+3)%11));
  return `<div class="kiyu-q"><span class="kiyu-q-num">ФРАЗА ${i+1} ИЗ ${ORDER.length}</span><h3 class="kiyu-q-title">${item.tr}</h3><div class="kiyu-order-target">${order.length?order.map((id,pos)=>`<button type="button" class="kiyu-order-token" data-remove="${i}" data-position="${pos}">${escapeHtml(item.tokens[id])} ×</button>`).join(''):'<span>Нажимай на слова ниже, чтобы собрать предложение</span>'}</div><div class="kiyu-order-bank">${shuffled.map(j=>`<button type="button" class="kiyu-token ${order.includes(j)?'chosen':''}" data-order="${i}" data-token="${j}" ${order.includes(j)?'disabled':''}>${escapeHtml(item.tokens[j])}</button>`).join('')}</div>${done?`<div class="${correct?'kiyu-order-correct':'kiyu-order-wrong'}">${correct?'✓ Правильно!':'Правильная фраза: '+escapeHtml(item.tokens.join(' '))}</div>`:''}<div class="kiyu-actions"><button type="button" class="btn outline" data-order-reset="${i}">Очистить ↺</button></div></div>`;
 }).join('');
 return `<div class="page">${header(5,'СОБИРАЕМ ФРАЗЫ','Собери предложение','Перенеси слова в правильном порядке. Нажимай на слова в нужной последовательности; лишнее можно убрать.')}<div class="kiyu-note">Наша цель — не переводить каждое слово по отдельности, а запомнить живые сочетания целиком.</div>${blocks}${check(5)}${footer(5)}</div>`;
}
function page6(){return `<div class="page">${header(6,'ВЫБОР ФОРМЫ','Подставь по смыслу','В каждой фразе выбирай правильное выражение в подходящем времени и лице.')} ${questions(6)}${footer(6)}</div>`;}
function page7(){return `<div class="page">${header(7,'МИНИ-ДИАЛОГИ','Как это сказать в жизни?','Магазин, дом, той и обычный разговор: выбери самую естественную реплику.')} ${questions(7)}${footer(7)}</div>`;}
function page8(){
 const total=Object.values(COUNT).reduce((a,b)=>a+b,0),score=Object.keys(COUNT).reduce((v,i)=>v+points(Number(i)),0);
 const cards=Object.keys(COUNT).map((k,i)=>`<div class="kiyu-stat"><b>${points(Number(k))}/${COUNT[k]}</b><small>${escapeHtml(NAMES[Number(k)])}</small></div>`).join('');
 const hasChecked=state.checked?.[8];
 return `<div class="page">${header(8,'ФИНАЛЬНАЯ ПРОВЕРКА','Ты уже различаешь оттенки?','Последние 10 вопросов — без подсказок. В конце увидишь итог всего урока.')}${questions(8)}
 <div class="kiyu-sum"><div class="kiyu-label">РЕЗУЛЬТАТ ВСЕЙ ПРАКТИКИ</div><div class="kiyu-summary-score">${score} / ${total}</div><p class="kiyu-helper">Верных ответов по всем блокам. Можно вернуться к любому заданию, исправить ответ и повысить результат.</p><div class="kiyu-stats">${cards}</div><button class="btn outline" type="button" data-go="3">Вернуться к практике ↺</button></div>
 <div class="kiyu-cta"><div class="kiyu-label" style="color:#ffb273">QAZLINE · ПРОДОЛЖЕНИЕ</div><h3>Тренируй живой казахский</h3><p>На занятиях мы разбираем оттенки сложных глаголов на примерах и отрабатываем их в разговоре с преподавателем.</p><a href="https://wa.me/77082397128?text=${encodeURIComponent('Здравствуйте! Я прошёл урок Qazline про глагол «кию» и хочу узнать о занятиях казахским.')}" data-cta="whatsapp" target="_blank" rel="noopener noreferrer">Узнать об обучении →</a></div></div>`;
}
const PAGES=[intro,page1,page2,page3,page4,page5,page6,page7,page8];
function render(){nav();el('app').innerHTML=PAGES[state.step]();saved();}
el('steps').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go);});
el('mobileStepSelect').addEventListener('change',e=>go(e.target.value));
el('restartTop').addEventListener('click',()=>{if(confirm('Сбросить все ответы и начать заново?')){state={step:0,answers:{},order:{},checked:{},started:false};render();}});
el('app').addEventListener('click',e=>{
 const cta=e.target.closest('[data-cta]');if(cta){track('lesson_cta_click');return;}
 const b=e.target.closest('button');if(!b)return;
 const a=b.dataset;
 if(a.go!==undefined){go(a.go);return;}
 if(a.q!==undefined){const step=state.step,idx=Number(a.q);if(!state.answers[step])state.answers[step]={};state.answers[step][idx]=Number(a.a);state.checked[step]=false;saved();
  const parent=b.closest('.kiyu-q');parent.querySelectorAll('.kiyu-choice').forEach(x=>{const sel=x.dataset.a===a.a;x.classList.toggle('sel',sel);x.classList.remove('good','bad');x.setAttribute('aria-pressed',String(sel));});
  const explanation=parent.querySelector('.kiyu-explain');if(explanation)explanation.remove();const box=el('app').querySelector('.kiyu-check-box');if(box)box.outerHTML=check(step);nav();return;
 }
 if(a.order!==undefined){let i=Number(a.order),token=Number(a.token);if(!state.order[i])state.order[i]=[];if(!state.order[i].includes(token)){state.order[i].push(token);state.checked[5]=false;render();}return;}
 if(a.remove!==undefined){let i=Number(a.remove),pos=Number(a.position);state.order[i]?.splice(pos,1);state.checked[5]=false;render();return;}
 if(a.orderReset!==undefined){state.order[Number(a.orderReset)]=[];state.checked[5]=false;render();return;}
 if(a.check!==undefined){const step=Number(a.check);state.checked[step]=true;track('lesson_practice_checked',{step,correct:points(step),total:COUNT[step]});if(complete(step))track('lesson_step_complete',{step});render();return;}
});
render();
})();</script></body></html>
